<!doctype html>
<html lang="uk">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Освітлення · перегляд картки
  </title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color-scheme: light;
      --primary-text-color: #262a31;
      --secondary-text-color: #70757e;
      --card-background-color: #ffffff;
      --divider-color: #e3e5e8;
      --primary-color: #e8d59a;
      --error-color: #ffb0a7;
    }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #262a31;
      padding: 40px;
    }
    header {
      margin-bottom: 30px;
    }
    h1 {
      font-size: 28px;
      font-weight: 500;
      margin: 10px 0;
    }
    header p {
      color: #70757e;
      font-size: 13px;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 3px;
      color: #8a6829;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
      max-width: 1800px;
    }
    .label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #70757e;
      margin: 0 0 12px;
    }
    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 600px) {
      body {
        padding: 20px 14px;
      }
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
  <header>
    <span class="eyebrow">SONOFF / ОСВІТЛЕННЯ</span>
    <h1>Світло під контролем.</h1>
    <p>Керування освітленням · Чотири стани картки</p>
  </header>
  <main class="grid"></main>
  <script type="module">
    import '../dist/sonoff-outdoor-light-card.js';
    for (const state of ['off', 'on', 'pending', 'unavailable']) {
      const section = document.createElement('section');
      section.innerHTML = `<p class="label">${{ off: 'ВИМКНЕНО', on: 'УВІМКНЕНО', pending: 'ОЧІКУВАННЯ', unavailable: 'НЕДОСТУПНО' }[state]}</p>`;
      const card = document.createElement('sonoff-outdoor-light-card');
      card.id = state;
      card.setConfig({
        type: 'custom:sonoff-outdoor-light-card',
        entity: 'switch.garden_lights',
        name: 'Освітлення',
      });
      const update = (next) => {
        card.hass = {
          states: { 'switch.garden_lights': { state: next, attributes: { friendly_name: 'Освітлення' } } },
          callService: async (domain, service) => {
            if (state === 'pending') return new Promise(() => {});
            await new Promise((r) => setTimeout(r, 1000));
            update(service === 'turn_on' ? 'on' : 'off');
          },
        };
      };
      update(state === 'pending' ? 'off' : state);
      section.append(card);
      document.querySelector('main').append(section);
      await card.updateComplete;
      if (state === 'pending') card.shadowRoot.querySelector('button').click();
    }
  </script>
</html>
